<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AtelierMF · Gestor</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7C9D4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AtelierMF">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<script>(function(){try{var t=localStorage.getItem('ateliermf:tema')||'auto';var d=t==='escuro'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'escuro':'claro'}catch(e){}})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --vinho:#4E1B27;--vinho-2:#7A3A4A;--tinta:#3B1620;--muted:#8A6B73;
  --bg:#FCF7F7;--linha:#F0E2E4;
  --rosa:#F7C9D4;--rosa-s:#A8284F;--rosa-v:#E56A8E;
  --pessego:#FFDCC2;--pessego-s:#9A4A12;--pessego-v:#F2913F;
  --ouro:#FBE9A8;--ouro-s:#7A5A05;--ouro-v:#E3B12E;
  --salvia:#CDE9D3;--salvia-s:#2A6B45;--salvia-v:#5BB37F;
  --ceu:#CFE4F7;--ceu-s:#1F5F9B;--ceu-v:#4B9BE0;
  --lilas:#E0D5F5;--lilas-s:#5B3BA0;--lilas-v:#9A7BE0;
  --card:#fff;--track:#F5ECEE;--soft:#FBF3F4;--hover:#FAF1F2;--neutro:#F1E6E8;
  --acc:#4E1B27;--acc-t:#fff;--acc-h:#6A2A3A;--ic-bg:rgba(255,255,255,.72);--ic-bg2:rgba(255,255,255,.75);
}
[data-theme=escuro]{
  color-scheme:dark;
  --vinho:#F8DCE4;--vinho-2:#D8B0BC;--tinta:#F2E4E8;--muted:#B598A2;--bg:#1B1216;--linha:#3B2B33;
  --rosa:#4B2431;--rosa-s:#F6B4C6;--pessego:#4D3122;--pessego-s:#FFC79F;--ouro:#4A3E1A;--ouro-s:#F6DE8A;
  --salvia:#243F30;--salvia-s:#A9DDB9;--ceu:#233A52;--ceu-s:#A8D0F3;--lilas:#3A2F57;--lilas-s:#CDBDF3;
  --card:#291C22;--track:#3A2A31;--soft:#33242B;--hover:#33242B;--neutro:#3A2A31;
  --acc:#E56A8E;--acc-t:#2A0F18;--acc-h:#EE86A4;--ic-bg:rgba(255,255,255,.12);--ic-bg2:rgba(255,255,255,.14);
}
[data-theme=escuro] .logo,[data-theme=escuro] .topm img{filter:brightness(0) invert(.92)}
*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--tinta);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Gilda Display',Georgia,serif;font-weight:400;color:var(--vinho);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
p{margin:0 0 8px}
.c-rosa{--cb:var(--rosa);--cf:var(--rosa-s);--cv:var(--rosa-v)}
.c-pessego{--cb:var(--pessego);--cf:var(--pessego-s);--cv:var(--pessego-v)}
.c-ouro{--cb:var(--ouro);--cf:var(--ouro-s);--cv:var(--ouro-v)}
.c-salvia{--cb:var(--salvia);--cf:var(--salvia-s);--cv:var(--salvia-v)}
.c-ceu{--cb:var(--ceu);--cf:var(--ceu-s);--cv:var(--ceu-v)}
.c-lilas{--cb:var(--lilas);--cf:var(--lilas-s);--cv:var(--lilas-v)}
.c-neutro{--cb:var(--neutro);--cf:var(--vinho);--cv:var(--vinho-2)}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--lilas-v);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;background:var(--card);border-right:1px solid var(--linha);overflow:auto}
.logo{width:170px;height:auto;margin:0 auto 12px;display:block}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:16px;font-weight:800;color:var(--vinho-2);text-decoration:none;position:relative}
.nav a .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--cb);color:var(--cf);flex:none}
.nav a:hover{background:var(--hover)}
.nav a[aria-current=page]{background:var(--cb);color:var(--vinho)}
.nav a[aria-current=page] .ic{background:var(--card)}
.badge{margin-left:auto;background:var(--rosa-v);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;font-weight:800}
.sidebtm{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px}
.sync{padding:10px 12px;border-radius:14px;font-size:12.5px;font-weight:700;background:var(--salvia);color:var(--salvia-s)}
.sync.demo{background:var(--ouro);color:var(--ouro-s)}
.col{min-width:0}
.topm{display:none;justify-content:center;padding:calc(10px + env(safe-area-inset-top)) 0 0}
.topm img{height:64px;width:auto}
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1240px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.head h1{font-size:clamp(30px,4vw,42px);line-height:1.05}
.head p{margin:6px 0 0;color:var(--muted);font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:800;background:var(--acc);color:var(--acc-t);cursor:pointer;text-decoration:none;transition:transform .12s,background .12s,filter .12s}
.btn:hover{background:var(--acc-h)}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--cb,var(--neutro));color:var(--cf,var(--vinho))}
.btn.soft:hover{background:var(--cb,var(--neutro));filter:brightness(.96)}
.btn.ghost{background:transparent;border:1.5px solid var(--linha);color:var(--vinho-2)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:var(--rosa);color:var(--rosa-s)}
.btn.danger:hover{background:var(--rosa);filter:brightness(.96)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ico{padding:8px;border-radius:12px}
.in{width:100%;font-weight:600;padding:10px 14px;border:1.5px solid var(--linha);border-radius:14px;background:var(--card)}
.in:focus{outline:0;border-color:var(--lilas-v);box-shadow:0 0 0 4px var(--lilas)}
textarea.in{resize:vertical;min-height:70px}
label.f,div.f{display:block;font-weight:800;font-size:13px;color:var(--vinho-2);margin-bottom:12px}
label.f>.in,label.f>.dur,label.f>.opts,div.f>.opts,div.f>.fotoBox{margin-top:5px}
.hint{display:block;font-weight:600;font-size:12px;color:var(--muted);margin-top:4px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.dur{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--muted)}
.dur .in{width:76px;padding:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.opt span{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-weight:800;background:var(--track);color:var(--vinho-2);border:2px solid transparent}
.opt input:checked+span{background:var(--cb);color:var(--cf);border-color:var(--cv)}
.opt input:focus-visible+span{outline:3px solid var(--lilas-v);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}
.filters .in{width:auto;min-width:180px}
.filters .grow{flex:1 1 240px}
.fchip{border:0;cursor:pointer;padding:7px 14px;border-radius:999px;font-weight:800;background:var(--card);border:1.5px solid var(--linha);color:var(--vinho-2)}
.fchip.on{background:var(--cb,var(--acc));color:var(--cf,var(--acc-t));border-color:var(--cv,var(--acc))}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--cb);color:var(--cf);white-space:nowrap}
button.chip{border:0;cursor:pointer}

/* cards */
.card{background:var(--card);border:1px solid var(--linha);border-radius:22px;padding:20px}
.card h2{font-size:22px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--cb);border-radius:26px;padding:18px 20px;color:var(--vinho);position:relative;overflow:hidden;min-height:118px}
.stat .k{font-weight:800;font-size:13px;color:var(--cf);padding-right:44px}
.stat .v{font-family:'Gilda Display',serif;font-size:34px;line-height:1.1;margin:6px 0 2px}
.stat .s{font-size:13px;font-weight:700;color:var(--cf)}
.stat .ic{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:14px;background:var(--ic-bg);display:grid;place-items:center;color:var(--cf)}
.hero{border-radius:32px;padding:26px clamp(18px,3vw,36px);background:var(--pessego);display:flex;flex-wrap:wrap;gap:18px 30px;justify-content:space-between;align-items:center;margin-bottom:16px;position:relative;overflow:hidden}
.hero .sun{position:absolute;right:-30px;top:-34px;width:200px;height:200px;color:var(--ouro-v);opacity:.55;pointer-events:none}
.hero h1{font-size:clamp(28px,4vw,40px)}
.hero p{color:var(--pessego-s);font-weight:700;margin:6px 0 0;max-width:46ch}
.hero .meta{min-width:min(280px,100%);position:relative}
.hero .meta b{font-weight:800;color:var(--vinho)}
.bar{height:12px;border-radius:99px;background:var(--ic-bg2);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .5s}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-weight:600}
.empty .sun{width:56px;height:56px;color:var(--ouro-v);margin:0 auto 10px;display:block}
.empty h3{font-size:22px;margin-bottom:6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.peca{background:var(--card);border:1px solid var(--linha);border-radius:24px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.peca:hover{transform:translateY(-3px);box-shadow:0 12px 30px -14px rgba(78,27,39,.35)}
.peca .foto{aspect-ratio:4/3;background:var(--cb);display:grid;place-items:center;overflow:hidden}
.peca .foto img{width:100%;height:100%;object-fit:cover;display:block}
.peca .foto span{font-family:'Gilda Display',serif;font-size:64px;color:var(--cf);opacity:.85}
.peca .corpo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.peca h3{font-size:20px;line-height:1.15}
.peca .mm{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-weight:700}
.peca .mm b{display:block;font-size:14px;color:var(--vinho);font-weight:800}
.peca .rod{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:10px 14px}
.li .grow{flex:1 1 200px;min-width:0}
.li .sub{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;gap:4px 12px;flex-wrap:wrap}
.li .stk{flex:1 1 190px;min-width:150px}
.li .stk .t{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin:4px 0}
.li .stk .t i{display:block;height:100%;background:var(--salvia-v);border-radius:99px}
.li .stk .t i.lowbar{background:var(--rosa-v)}
.li .stk small{color:var(--muted);font-weight:600;font-size:12px}
.li .qty.low b{color:var(--rosa-s)}
.li .acts{margin-left:auto}
.nm{display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--linha);flex:none}
.grp{margin:22px 0 10px;display:flex;align-items:center;gap:10px;font-family:'Gilda Display',serif;font-size:22px;color:var(--vinho)}
.dayh{margin:18px 0 8px;font-weight:800;color:var(--vinho-2);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:10px;padding-top:10px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bpair{display:flex;align-items:flex-end;gap:4px;height:130px}
.bpair i{display:block;width:20px;border-radius:8px 8px 3px 3px;min-height:3px}
.bcol b{font-size:13px;color:var(--vinho)}
.bcol small{font-weight:700;color:var(--muted);font-size:11px;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--vinho-2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.hb{display:grid;grid-template-columns:104px 1fr 92px;gap:10px;align-items:center;margin:9px 0;font-weight:700;font-size:13.5px}
.hb .t{height:14px;border-radius:99px;background:var(--track);overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:99px;background:var(--cv)}
.hb em{font-style:normal;text-align:right;color:var(--vinho);white-space:nowrap}
.mini{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--linha)}
.mini:last-child{border-bottom:0}
.mini small{color:var(--muted);font-weight:600;display:block}
.tw{overflow-x:auto;margin:0 -6px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:800;color:var(--vinho-2);padding:8px 10px;border-bottom:2px solid var(--linha);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--linha);white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tfoot td{font-weight:800;border-bottom:0;color:var(--vinho)}
.sect{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sect h2{margin:0}
.timer{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;background:var(--cb,var(--ceu));border:0;border-radius:28px;padding:22px}
.timer .clock{font-family:'Gilda Display',serif;font-size:clamp(40px,7vw,64px);line-height:1;color:var(--vinho);letter-spacing:1px}
.timer form{flex:1 1 360px;display:grid;gap:10px}
.tchip{position:fixed;right:18px;bottom:18px;z-index:30;display:none}
.tchip.on{display:block}
.tchip button{box-shadow:0 10px 30px -10px rgba(78,27,39,.5);background:var(--acc);color:var(--acc-t)}
.tchip .timer-clock{font-variant-numeric:tabular-nums}

/* dialogs */
dialog{border:0;border-radius:28px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--card);color:var(--tinta);box-shadow:0 30px 80px -20px rgba(78,27,39,.45);overflow:hidden}
dialog.wide{width:min(880px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(78,27,39,.42);backdrop-filter:blur(2px)}
.dlg-in{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:22px 24px 6px}
.dh h2{font-size:28px;line-height:1.1}
.dbody{padding:10px 24px 16px;overflow:auto;flex:1}
.foot{padding:12px 24px 18px;border-top:1px solid var(--linha);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.foot .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.sec{font-family:'Gilda Display',serif;font-size:19px;color:var(--vinho);margin:14px 0 8px}
.prevbox{background:var(--soft);border-radius:18px;padding:12px 16px;margin:4px 0 14px}
.pv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;font-weight:600;color:var(--vinho-2)}
.pv b{color:var(--vinho)}
.pv.tot{border-top:1.5px solid var(--linha);margin-top:4px;padding-top:8px;font-weight:800}
.mrow{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-bottom:8px}
.fotoBox{display:flex;gap:14px;align-items:center}
.fotoPrev{width:84px;height:84px;border-radius:20px;background:var(--pessego);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--pessego-s)}
.fotoPrev img{width:100%;height:100%;object-fit:cover}
.det{display:grid;grid-template-columns:200px 1fr;gap:18px;margin-bottom:8px}
.det .foto{border-radius:22px;overflow:hidden;background:var(--cb);aspect-ratio:1;display:grid;place-items:center}
.det .foto img{width:100%;height:100%;object-fit:cover}
.det .foto span{font-family:'Gilda Display',serif;font-size:80px;color:var(--cf)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.kpi{background:var(--cb);border-radius:16px;padding:10px 12px}
.kpi small{display:block;font-weight:800;color:var(--cf);font-size:12px}
.kpi b{font-family:'Gilda Display',serif;font-size:22px;font-weight:400;color:var(--vinho)}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--track);margin:8px 0}
.stack i{display:block;height:100%}
.tempo{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;align-items:center;font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--acc);color:var(--acc-t);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
#login{position:fixed;inset:0;display:none;place-items:center;background:var(--bg);z-index:50;padding:20px;overflow:auto}
#login.on{display:grid}
.lcard{width:min(400px,100%);background:var(--card);border-radius:32px;padding:28px;border:1px solid var(--linha);text-align:center}
.lcard .logo{width:200px}
.lcard form{text-align:left;margin-top:12px}
.err{color:var(--rosa-s);font-weight:700;min-height:20px;font-size:13px}
pre.code{background:var(--soft);border-radius:14px;padding:12px;font-size:12.5px;overflow:auto;margin:8px 0}
details{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:12px 16px;margin-bottom:12px}
details summary{cursor:pointer;font-weight:800;color:var(--vinho)}
ol.steps{padding-left:20px;margin:10px 0 0}
ol.steps li{margin-bottom:6px}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--linha);z-index:20}
  .side .logo,.sidebtm{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-between;margin:0;gap:0}
  .nav a{flex:1;flex-direction:column;gap:2px;font-size:9.5px;padding:4px 0;justify-content:center;text-align:center;min-width:0}
  .nav a .ic{width:34px;height:28px;border-radius:10px}
  .nav a[aria-current=page]{background:transparent}
  .nav a[aria-current=page] .ic{background:var(--cb);box-shadow:0 0 0 2px var(--cv)}
  .badge{position:absolute;top:0;right:6px;margin:0}
  .topm{display:flex}
  main{padding-bottom:110px}
  .tchip{bottom:84px}
  .toast{bottom:100px}
  dialog{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:26px 26px 0 0;max-height:94vh}
  .dlg-in{max-height:94vh}
  .dh,.dbody,.foot{padding-left:18px;padding-right:18px}
  .foot{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .det{grid-template-columns:1fr}
  .det .foto{max-width:200px}
  .g2,.g3{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
}
@media(max-width:520px){.hb{grid-template-columns:84px 1fr 84px}.mrow{grid-template-columns:1fr 84px auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.metas{display:flex;flex-direction:column;gap:14px;min-width:min(280px,100%);position:relative}
.cklist{display:grid;gap:6px;max-height:260px;overflow:auto;margin:6px 0 12px}
.ck{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1.5px solid var(--linha);border-radius:14px;font-weight:700;cursor:pointer;background:var(--card)}
.ck small{margin-left:auto;color:var(--muted);font-weight:600;white-space:nowrap}
.ck input[type=checkbox]{width:18px;height:18px;flex:none}
.ck input[type=number]{width:72px;padding:6px 8px;margin-left:auto}
.ck.qt small{margin-left:0}
#printArea{display:none;font-family:'Nunito',sans-serif;color:var(--tinta)}
.pa-page{position:relative;height:296mm;padding:14mm 12mm;box-sizing:border-box;overflow:hidden;break-after:page;page-break-after:always;background:var(--bg)}
.pa-page:last-child{break-after:auto;page-break-after:auto}
.pa-page .sun{position:absolute;right:-14mm;top:-14mm;width:64mm;height:64mm;color:var(--ouro-v);opacity:.4}
.pa-head{display:flex;align-items:center;gap:6mm;margin-bottom:8mm;position:relative}
.pa-head img{height:20mm;width:auto}
.pa-head h2{font-size:28pt;line-height:1}
.pa-head p{margin:1mm 0 0;color:var(--muted);font-weight:700}
.pa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm;position:relative}
.pa-card{background:var(--card);border:.3mm solid var(--linha);border-radius:6mm;overflow:hidden;break-inside:avoid;display:flex;flex-direction:column}
.pa-foto{aspect-ratio:4/3;background:var(--cb);display:grid;place-items:center;overflow:hidden}
.pa-foto img{width:100%;height:100%;object-fit:cover;display:block}
.pa-ph{font-family:'Gilda Display',serif;font-size:44pt;color:var(--cf)}
.pa-body{padding:3mm 3.5mm 3.5mm;display:flex;flex-direction:column;gap:1.2mm}
.pa-card h3{font-size:13pt;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pa-chip{align-self:flex-start;background:var(--cb);color:var(--cf);font-size:7.5pt;font-weight:800;padding:.6mm 2.5mm;border-radius:99px}
.pa-card p{font-size:8.5pt;margin:0;color:var(--vinho-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.pa-card b{font-size:13pt;color:var(--vinho);font-weight:800}
.pa-page.etiq{background:#fff}
.pa-eti{display:grid;grid-template-columns:repeat(3,58mm);gap:4mm 3mm;justify-content:center}
.eti{width:58mm;height:32mm;border:.3mm dashed #999;border-radius:3mm;padding:2.5mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;break-inside:avoid;gap:1mm;overflow:hidden}
.eti .eb{font-family:'Gilda Display',serif;font-size:7pt;color:#8A6B73;letter-spacing:.3mm}
.eti .en{font-family:'Gilda Display',serif;font-size:11pt;line-height:1.1;color:#4E1B27;font-weight:400}
.eti .ep{font-size:16pt;font-weight:800;color:#4E1B27}
@media print{body.pr-cat .app,body.pr-cat .tchip,body.pr-eti .app,body.pr-eti .tchip{display:none!important}body.pr-cat #printArea,body.pr-eti #printArea{display:block}body.pr-cat{background:var(--bg)}body.pr-cat *,body.pr-eti *{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{margin:12mm}.side,.topm,.acts,.filters,.tchip,.noprint,.toast{display:none!important}.app{display:block}main{padding:0}body{background:var(--card)}}
</style>

function range(per){
  const t=today(),y=+t.slice(0,4),m=+t.slice(5,7);
  if(per==='mes')return[t.slice(0,8)+'01',t];
  if(per==='mesPassado')return[isoDate(new Date(y,m-2,1)),isoDate(new Date(y,m-1,0))];
  if(per==='7')return[addDays(t,-6),t];
  if(per==='30')return[addDays(t,-29),t];
  if(per==='90')return[addDays(t,-89),t];
  if(per==='ano')return[`${y}-01-01`,t];
  return['0000-01-01','9999-12-31'];
}

/* tempo médio por peça em cada etapa: usa o que foi cronometrado; se não houver, usa a estimativa */
function tempoPorUnidade(p,logs){
  logs=logs||S.horas.filter(h=>h.pecaId===p.id);
  const out={};
  ETAPAS.forEach(e=>{
    const l=logs.filter(h=>h.etapa===e.id),u=sum(l,h=>h.unidades||1),m=sum(l,h=>h.minutos);
    out[e.id]=u>0?{min:m/u,real:true}:{min:(p.estimado&&p.estimado[e.id])||0,real:false};
  });
  return out;
}
function calcPeca(p){
  const cer=matById(p.ceramicaId);
  const cCer=cer?(p.ceramicaG||0)*(cer.custoUnit||0):0;
  let cOut=0;(p.materiais||[]).forEach(x=>{const m=matById(x.materialId);if(m)cOut+=(x.qtd||0)*(m.custoUnit||0)});
  const extras=p.extras||0,t=tempoPorUnidade(p);
  let horasTrab=0,labMin=0;
  ETAPAS.forEach(e=>{if(e.trabalho)horasTrab+=t[e.id].min/60;if(e.trabalho||S.cfg.incluirSecagem)labMin+=t[e.id].min});
  const labor=labMin/60*S.cfg.valorHora,mat=cCer+cOut+extras,custo=mat+labor,preco=p.precoVenda||0;
  return{cCer,cOut,extras,mat,labor,custo,tempo:t,horasTrab,preco,lucro:preco-custo,
    margem:preco?(preco-custo)/preco*100:0,sugerido:custo*S.cfg.multiplicador,
    ganhoHora:horasTrab>0?(preco-mat)/horasTrab:0};
}
function necessidades(p,q){
  const mp=new Map();
  const add=(id,qt)=>{const m=matById(id);if(!m||!(qt>0))return;const o=mp.get(id)||{m,qtd:0,custo:0};o.qtd+=qt*q;o.custo+=qt*q*(m.custoUnit||0);mp.set(id,o)};
  add(p.ceramicaId,p.ceramicaG);(p.materiais||[]).forEach(x=>add(x.materialId,x.qtd));

}

const LS_KEY='ateliermf:v1',TIMER_KEY='ateliermf:timer';
function persistLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const raw=localStorage.getItem(LS_KEY);if(!raw)return false;const d=JSON.parse(raw);COLS.forEach(c=>S[c]=d[c]||[]);S.cfg={...DEFAULT_CFG,...(d.cfg||{})};return true}catch(e){return false}}
const clean=o=>JSON.parse(JSON.stringify(o));
const store={
  async save(col,obj){
    obj=clean(obj);obj.id=obj.id||uid();
    if(USE_FB)await fs.collection(col).doc(obj.id).set(obj);
    else{const i=S[col].findIndex(x=>x.id===obj.id);if(i>=0)S[col][i]=obj;else S[col].push(obj);persistLocal();render()}
    return obj;
  },
  async patch(col,id,part){
    if(USE_FB)await fs.collection(col).doc(id).update(clean(part));
    else{const o=S[col].find(x=>x.id===id);if(o)Object.assign(o,part);persistLocal();render()}
  },
  async remove(col,id){
    if(USE_FB)await fs.collection(col).doc(id).delete();
    else{S[col]=S[col].filter(x=>x.id!==id);persistLocal();render()}
  },
  async saveCfg(part){
    Object.assign(S.cfg,part);
    if(USE_FB)await fs.collection('config').doc('geral').set(clean(S.cfg),{merge:true});else persistLocal();
    render();
  }
};
function subscribe(){
  unsub();
  COLS.forEach(c=>unsubs.push(fs.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({...d.data(),id:d.id}));render()},err=>{console.error(err);toast('Sem permissão ou sem conexão com o Firebase')})));
  unsubs.push(fs.collection('config').doc('geral').onSnapshot(d=>{S.cfg={...DEFAULT_CFG,...(d.exists?d.data():{})};render()}));
}
function unsub(){unsubs.forEach(f=>f());unsubs=[]}

function readPeca(form){
  const fd=new FormData(form),ids=fd.getAll('mat_id'),qs=fd.getAll('mat_qtd');

  const estimado={};ETAPAS.forEach(e=>estimado[e.id]=readDur(fd,'est_'+e.id));
  return{nome:(fd.get('nome')||'').trim(),categoria:(fd.get('categoria')||'').trim(),descricao:(fd.get('descricao')||'').trim(),foto:formFoto,ceramicaId:fd.get('ceramicaId')||'',ceramicaG:+fd.get('ceramicaG')||0,pesoG:+fd.get('pesoG')||0,materiais,estimado,extras:+fd.get('extras')||0,precoVenda:+fd.get('precoVenda')||0,estoque:Math.max(0,Math.round(+fd.get('estoque')||0))};
}

FORMS.produzir=async f=>{
  const p=peca(f.dataset.id),q=Math.round(+f.qtd.value||0);if(q<1){toast('Informe a quantidade');return}
  const nd=necessidades(p,q),falta=nd.filter(n=>n.qtd>n.m.qtd);
  if(falta.length&&!await ask('Estoque insuficiente',`Faltam: ${falta.map(n=>esc(n.m.nome)).join(', ')}. Registrar mesmo assim? Esses itens ficam com estoque zero.`,'Registrar mesmo assim'))return;
  for(const n of nd)await store.patch('materiais',n.m.id,{qtd:r2(Math.max(0,n.m.qtd-n.qtd))});
  await store.patch('pecas',p.id,{estoque:(p.estoque||0)+q});
  await store.save('producoes',{pecaId:p.id,qtd:q,data:today(),consumo:nd.map(n=>({materialId:n.m.id,nome:n.m.nome,unidade:n.m.unidade,qtd:n.qtd,custo:n.custo}))});
  closeModal();toast(`${q} peça(s) registradas e materiais descontados`);
};

}

  const low=S.materiais.filter(isLow),valor=sum(S.materiais.filter(m=>m.categoria!=='Ferramentas'),m=>m.qtd*m.custoUnit);

  return head('Materiais','Cerâmica, tintas, utensílios e embalagens, com o lugar onde cada coisa está guardada',

PAGES.relatorios=()=>{
  const [a,b]=range(UI.rel.per),inR=x=>x.data>=a&&x.data<=b;
  const vs=S.vendas.filter(inR),hs=S.horas.filter(inR),pr=S.producoes.filter(inR);
  const rec=sum(vs,v=>v.qtd*v.precoUnit),cm=sum(vs,v=>v.qtd*v.custoMat),mo=sum(vs,v=>v.qtd*v.maoObra),luc=rec-cm-mo,desp=despPeriodo(a,UI.rel.per==='mes'?monthEnd(today()):b),lucReal=luc-desp;
  const hTrab=sum(hs.filter(h=>etapa(h.etapa)?.trabalho),h=>h.minutos),hSec=sum(hs.filter(h=>h.etapa==='secagem'),h=>h.minutos);
  /* horas por peça */
  const hp=[...new Set(hs.map(h=>h.pecaId))].map(id=>{
    const p=peca(id),logs=hs.filter(h=>h.pecaId===id),por={};
    ETAPAS.forEach(e=>por[e.id]=sum(logs.filter(h=>h.etapa===e.id),h=>h.minutos));
    const medio=sum(ETAPAS.filter(e=>e.trabalho),e=>{const l=logs.filter(h=>h.etapa===e.id),u=sum(l,h=>h.unidades||1);return u?sum(l,h=>h.minutos)/u:0});
    return{nome:p?p.nome:'(peça removida)',por,trab:sum(ETAPAS.filter(e=>e.trabalho),e=>por[e.id]),medio};
  }).sort((x,y)=>y.trab-x.trab);
  /* lucratividade */
  const lp=[...new Set(vs.map(v=>v.pecaId))].map(id=>{
    const p=peca(id),l=vs.filter(v=>v.pecaId===id),c=p?calcPeca(p):null;
    const r=sum(l,v=>v.qtd*v.precoUnit),m=sum(l,v=>v.qtd*v.custoMat),o=sum(l,v=>v.qtd*v.maoObra);
    return{nome:p?p.nome:'(peça removida)',q:sum(l,v=>v.qtd),r,m,o,luc:r-m-o,gh:c?c.ganhoHora:0};
  }).sort((x,y)=>y.luc-x.luc);
  /* canais */
  const canais=CANAIS.map(c=>({c,v:sum(vs.filter(v=>v.canal===c),v=>v.qtd*v.precoUnit)})).filter(x=>x.v>0).sort((x,y)=>y.v-x.v),mxC=Math.max(1,...canais.map(x=>x.v));
  /* consumo */
  const cons={};pr.forEach(x=>(x.consumo||[]).forEach(c=>{const o=cons[c.materialId]||(cons[c.materialId]={nome:c.nome,un:c.unidade,q:0,custo:0});o.q+=c.qtd;o.custo+=c.custo}));
  const cl=Object.values(cons).sort((x,y)=>y.custo-x.custo);
  REL.horas=[['Peça',...ETAPAS.map(e=>e.nome+' (min)'),'Trabalho total (min)','Tempo médio por peça (min)'],...hp.map(x=>[x.nome,...ETAPAS.map(e=>n2(x.por[e.id])),n2(x.trab),n2(x.medio)])];
  REL.lucro=[['Peça','Vendidas','Receita','Materiais','Mão de obra','Lucro','Ganho por hora'],...lp.map(x=>[x.nome,x.q,n2(x.r),n2(x.m),n2(x.o),n2(x.luc),n2(x.gh)])];
  REL.consumo=[['Material','Quantidade','Unidade','Custo'],...cl.map(x=>[x.nome,n2(x.q),x.un,n2(x.custo)])];
  const th=(t,k)=>`<div class="sect"><h2>${t}</h2><button class="btn ghost sm noprint" data-act="csv" data-k="${k}">${ic('download')} CSV</button></div>`;
  return head('Relatórios','Horas, lucro e consumo, do jeito que você precisa para precificar',`${periodSelect('rel.per')}<button class="btn ghost" data-act="imprimir">${ic('print')} Imprimir</button>`)+
  `<div class="stats"><div class="stat c-rosa"><div class="k">Receita</div><div class="v">${brl(rec)}</div><div class="s">${num(sum(vs,v=>v.qtd))} peças, ticket médio ${brl(vs.length?rec/vs.length:0)}</div></div>
   <div class="stat c-pessego"><div class="k">Materiais</div><div class="v">${brl(cm)}</div><div class="s">${rec?num(cm/rec*100):0}% da receita</div></div>
   <div class="stat c-lilas"><div class="k">Sua mão de obra</div><div class="v">${brl(mo)}</div><div class="s">${fmtDur(hTrab)} trabalhadas</div></div>
   <div class="stat c-ouro"><div class="k">Despesas fixas</div><div class="v">${brl(desp)}</div><div class="s">MEI, feiras, embalagens...</div></div>
   <div class="stat c-salvia"><div class="k">Lucro real</div><div class="v">${brl(lucReal)}</div><div class="s">${rec?num(lucReal/rec*100):0}% da receita, depois de tudo</div></div></div>
  <div class="grid"><div class="card"><h2>Horas por etapa</h2>${ETAPAS.map(e=>{const m=sum(hs.filter(h=>h.etapa===e.id),h=>h.minutos),mx=Math.max(1,...hp.map(x=>0),...ETAPAS.filter(z=>z.trabalho).map(z=>sum(hs.filter(h=>h.etapa===z.id),h=>h.minutos)));return e.trabalho?`<div class="hb c-${e.c}"><span>${e.nome}</span><div class="t"><i style="width:${m/mx*100}%"></i></div><em>${fmtDur(m)}</em></div>`:''}).join('')}<p style="margin-top:10px"><span class="chip c-ceu">Secagem: ${fmtDur(hSec)}</span> <span class="hint" style="display:inline">tempo de espera</span></p></div>
  <div class="card"><h2>Vendas por canal</h2>${canais.length?canais.map(x=>`<div class="hb c-${corDe(x.c)}"><span>${x.c}</span><div class="t"><i style="width:${x.v/mxC*100}%"></i></div><em>${brl(x.v)}</em></div>`).join(''):'<p class="hint">Sem vendas no período.</p>'}</div></div>
  <div class="card" style="margin-bottom:16px">${th('Horas por peça','horas')}${hp.length?`<div class="tw"><table class="tbl"><thead><tr><th>Peça</th>${ETAPAS.map(e=>`<th class="n">${e.nome}</th>`).join('')}<th class="n">Trabalho</th><th class="n">Média por peça</th></tr></thead><tbody>${hp.map(x=>`<tr><td>${esc(x.nome)}</td>${ETAPAS.map(e=>`<td class="n">${fmtDur(x.por[e.id])}</td>`).join('')}<td class="n"><b>${fmtDur(x.trab)}</b></td><td class="n">${fmtDur(x.medio)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="hint">Sem horas no período.</p>'}</div>
  <div class="card" style="margin-bottom:16px">${th('Lucro por peça','lucro')}${lp.length?`<div class="tw"><table class="tbl"><thead><tr><th>Peça</th><th class="n">Vendidas</th><th class="n">Receita</th><th class="n">Materiais</th><th class="n">Mão de obra</th><th class="n">Lucro</th><th class="n">Ganho/hora</th></tr></thead><tbody>${lp.map(x=>`<tr><td>${esc(x.nome)}</td><td class="n">${x.q}</td><td class="n">${brl(x.r)}</td><td class="n">${brl(x.m)}</td><td class="n">${brl(x.o)}</td><td class="n"><b>${brl(x.luc)}</b></td><td class="n">${x.gh?brl(x.gh):'-'}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td class="n">${sum(lp,x=>x.q)}</td><td class="n">${brl(rec)}</td><td class="n">${brl(cm)}</td><td class="n">${brl(mo)}</td><td class="n">${brl(luc)}</td><td></td></tr></tfoot></table></div>`:'<p class="hint">Sem vendas no período.</p>'}</div>
  <div class="card">${th('Consumo de materiais na produção','consumo')}${cl.length?`<div class="tw"><table class="tbl"><thead><tr><th>Material</th><th class="n">Consumido</th><th class="n">Custo</th></tr></thead><tbody>${cl.map(x=>`<tr><td>${esc(x.nome)}</td><td class="n">${num(x.q,1)} ${x.un}</td><td class="n">${brl(x.custo)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td></td><td class="n">${brl(sum(cl,x=>x.custo))}</td></tr></tfoot></table></div>`:'<p class="hint">Nenhuma produção registrada no período. Use “Registrar produção” dentro da peça.</p>'}</div>`+despesasCard(a,b);
};

/* ============================ DESPESAS E CUSTOS FIXOS ============================ */
const monthEnd=iso=>isoDate(new Date(+iso.slice(0,4),+iso.slice(5,7),0));
const daysBetween=(x,y)=>Math.round((new Date(y+'T12:00:00')-new Date(x+'T12:00:00'))/864e5);
const despMes=ym=>sum(S.despesas.filter(d=>d.recorrente?d.data.slice(0,7)<=ym:d.data.startsWith(ym)),d=>d.valor);
function despPeriodo(a,b){
  const t=today();if(b>'2100')b=t;
  if(a<'1900'){const ds=[...S.vendas,...S.horas,...S.despesas].map(x=>x.data).filter(Boolean).sort();a=ds[0]||t}
  if(a>b)return 0;
  let tot=sum(S.despesas.filter(d=>!d.recorrente&&d.data>=a&&d.data<=b),d=>d.valor);
  let y=+a.slice(0,4),m=+a.slice(5,7);const fy=+b.slice(0,4),fm=+b.slice(5,7);
  while(y<fy||(y===fy&&m<=fm)){
    const ym=`${y}-${pad(m)}`,first=ym+'-01',last=monthEnd(first),lo=a>first?a:first,hi=b<last?b:last,ov=daysBetween(lo,hi)+1;
    if(ov>0)tot+=sum(S.despesas.filter(d=>d.recorrente&&d.data.slice(0,7)<=ym),d=>d.valor)*ov/(daysBetween(first,last)+1);
    m++;if(m>12){m=1;y++}
  }
  return tot;
}
function despesasCard(a,b){
  const l=S.despesas.filter(d=>d.recorrente||(d.data>=a&&d.data<=b)).sort((x,y)=>(y.recorrente-x.recorrente)||y.data.localeCompare(x.data));
  return `<div class="card" style="margin-top:16px"><div class="sect"><h2>Despesas e custos fixos</h2><button class="btn soft c-ouro sm noprint" data-act="novaDesp">${ic('plus')} Nova despesa</button></div>
  <p class="hint" style="margin-top:-6px">Custos mensais (MEI, internet...) entram proporcionais aos dias do período. Gastos avulsos (feiras, divulgação) entram na data em que aconteceram.</p>
  ${l.length?`<div class="list">${l.map(d=>`<div class="li"><div class="grow"><b>${esc(d.nome)}</b><div class="sub"><span>${d.recorrente?'Todo mês desde '+fmtDate(d.data):fmtDate(d.data)}</span></div></div><span class="chip c-${d.recorrente?'lilas':'ouro'}">${d.recorrente?'Mensal':'Avulsa'}</span><b>${brl(d.valor)}</b><div class="acts noprint"><button class="btn ghost ico" data-act="editDesp" data-id="${d.id}" aria-label="Editar despesa">${ic('edit')}</button><button class="btn ghost ico" data-act="delDesp" data-id="${d.id}" aria-label="Excluir despesa">${ic('trash')}</button></div></div>`).join('')}</div>`:'<p class="hint">Nenhuma despesa cadastrada.</p>'}</div>`;
}

  const d=id?S.despesas.find(x=>x.id===id):{nome:'',valor:'',data:today(),recorrente:false};
  openModal(`<form class="dlg-in" data-form="desp" data-id="${id||''}"><div class="dh"><h2>${id?'Editar despesa':'Nova despesa'}</h2>${closeBtn()}</div><div class="dbody">

    <label class="f">Data<input class="in" type="date" name="data" required value="${d.data}"></label></div>
    <label class="ck"><input type="checkbox" name="rec" ${d.recorrente?'checked':''}><span>Repete todo mês, a partir dessa data</span></label></div>
    <div class="foot"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn">${ic('check')} Salvar despesa</button></div></form>`);
}
FORMS.desp=async f=>{const fd=new FormData(f),v=+fd.get('valor')||0;if(v<=0){toast('Informe o valor');return}
  await store.save('despesas',{id:f.dataset.id||uid(),nome:fd.get('nome').trim(),valor:v,data:fd.get('data'),recorrente:fd.get('rec')==='on'});closeModal();toast('Despesa salva')};
A.novaDesp=()=>despForm();
A.editDesp=d=>despForm(d.id);
A.delDesp=async d=>{if(await ask('Excluir despesa?','Ela deixa de contar nos relatórios e no lucro do mês.'))await store.remove('despesas',d.id)};

/* ============================ CATÁLOGO E ETIQUETAS ============================ */
let tituloOriginal='';
async function imprimir(cls){
  /* margem 0 faz o navegador omitir data, título, endereço e nº de página; as margens visuais ficam dentro de cada .pa-page */
  const st=document.createElement('style');st.id='pgStyle';st.textContent='@page{size:A4;margin:0}';document.head.appendChild(st);
  tituloOriginal=document.title;document.title=cls==='pr-cat'?'Catálogo - Atelier Mariana Fragoso':'Etiquetas - Atelier Mariana Fragoso';
  document.body.classList.add(cls);
  await Promise.all($$('#printArea img').map(i=>i.decode?i.decode().catch(()=>{}):0));
  setTimeout(()=>window.print(),80);
}
window.addEventListener('afterprint',()=>{const st=$('#pgStyle');if(st)st.remove();if(tituloOriginal){document.title=tituloOriginal;tituloOriginal=''}});
const paginar=(it,primeira,demais)=>{const pg=[];let i=0,n=primeira;while(i<it.length){pg.push(it.slice(i,i+n));i+=n;n=demais}return pg.length?pg:[[]]};
const semFoto=p=>`<div class="pa-ph">${esc((p.nome||'?')[0]).toUpperCase()}</div>`;
const catSel=f=>{const ids=new Set($$('[name=pid]:checked',f).map(c=>c.value));return S.pecas.filter(p=>ids.has(p.id)).sort(byNome)};
const catTexto=f=>{const pr=f.preco.checked,ds=f.desc.checked;return '*Atelier Mariana Fragoso* - feito à mão\n\n'+catSel(f).map(p=>`*${p.nome}*${pr&&p.precoVenda?` - ${brl(p.precoVenda)}`:''}${ds&&p.descricao?`\n${p.descricao}`:''}`).join('\n\n')};
A.catalogo=()=>{
  if(!S.pecas.length){toast('Cadastre peças primeiro');return}
  openModal(`<form class="dlg-in" data-form="noop" data-live="catalogo"><div class="dh"><h2>Catálogo para compartilhar</h2>${closeBtn()}</div><div class="dbody">
    <p class="hint" style="margin-top:0">Escolha o que aparece e copie o texto para o WhatsApp ou gere um PDF com fotos.</p>
    <div class="cklist"><label class="ck"><input type="checkbox" name="soEstoque"><span>Só peças em estoque</span></label><label class="ck"><input type="checkbox" name="preco" checked><span>Mostrar preço</span></label><label class="ck"><input type="checkbox" name="desc" checked><span>Mostrar descrição</span></label></div>
    <div class="sec">Peças</div>
    <div class="cklist">${S.pecas.slice().sort(byNome).map(p=>`<label class="ck"><input type="checkbox" name="pid" value="${p.id}" checked><span>${esc(p.nome)}</span><small>${brl(p.precoVenda)}, ${p.estoque||0} em estoque</small></label>`).join('')}</div>
    <div class="sec">Texto para WhatsApp</div><textarea class="in" id="catTxt" rows="8" readonly></textarea></div>
    <div class="foot"><button type="button" class="btn ghost" data-act="copiarCat">${ic('copy')} Copiar texto</button><button type="button" class="btn" data-act="pdfCat">${ic('download')} Gerar PDF</button></div></form>`,true);
  LIVE.catalogo($('#dlg form'));
};
LIVE.catalogo=(f,e)=>{
  if(e&&e.target.name==='soEstoque')$$('[name=pid]',f).forEach(c=>{c.checked=f.soEstoque.checked?(peca(c.value).estoque>0):true});
  $('#catTxt',f).value=catTexto(f);
};
FORMS.noop=()=>{};
A.copiarCat=async(d,el)=>{try{await navigator.clipboard.writeText($('#catTxt').value);toast('Texto copiado')}catch(e){toast('Não foi possível copiar')}};
A.pdfCat=async(d,el)=>{
  const f=el.closest('form'),ps=catSel(f),pr=f.preco.checked,ds=f.desc.checked;
  if(!ps.length){toast('Escolha ao menos uma peça');return}
  const card=p=>`<div class="pa-card c-${corDe(p.categoria||p.nome)}"><div class="pa-foto">${p.foto?`<img src="${p.foto}" alt="">`:semFoto(p)}</div><div class="pa-body"><h3>${esc(p.nome)}</h3>${p.categoria?`<span class="pa-chip">${esc(p.categoria)}</span>`:''}${ds&&p.descricao?`<p>${esc(p.descricao)}</p>`:''}${pr&&p.precoVenda?`<b>${brl(p.precoVenda)}</b>`:''}</div></div>`;
  const cab=`<div class="pa-head"><img src="${LOGO}" alt=""><div><h2>Catálogo</h2><p>Peças feitas à mão</p></div></div>`;
  $('#printArea').innerHTML=paginar(ps,6,9).map((g,i)=>`<section class="pa-page">${i===0?SUN+cab:''}<div class="pa-grid">${g.map(card).join('')}</div></section>`).join('');
  closeModal();toast('Na janela de impressão, escolha “Salvar como PDF”');await imprimir('pr-cat');
};
A.etiquetas=()=>{
  if(!S.pecas.length){toast('Cadastre peças primeiro');return}
  openModal(`<form class="dlg-in" data-form="etiquetas"><div class="dh"><h2>Etiquetas de preço</h2>${closeBtn()}</div><div class="dbody">
    <p class="hint" style="margin-top:0">Quantas etiquetas de cada peça? Sugerimos a quantidade em estoque. Use 0 para pular.</p>
    <div class="cklist" style="max-height:340px">${S.pecas.slice().sort(byNome).map(p=>`<label class="ck qt"><span>${esc(p.nome)}</span><small>${brl(p.precoVenda)}</small><input class="in" type="number" min="0" max="60" step="1" name="q_${p.id}" value="${Math.min(60,p.estoque||0)}" aria-label="Etiquetas de ${esc(p.nome)}"></label>`).join('')}</div></div>
    <div class="foot"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn">${ic('print')} Imprimir etiquetas</button></div></form>`);
};
FORMS.etiquetas=async f=>{
  const fd=new FormData(f),et=[];
  S.pecas.forEach(p=>{const q=Math.max(0,Math.round(+fd.get('q_'+p.id)||0));for(let i=0;i<q;i++)et.push(p)});
  if(!et.length){toast('Informe ao menos uma etiqueta');return}
  $('#printArea').innerHTML=paginar(et,21,21).map(g=>`<section class="pa-page etiq"><div class="pa-eti">${g.map(p=>`<div class="eti"><span class="eb">atelier mariana fragoso</span><b class="en">${esc(p.nome)}</b><span class="ep">${brl(p.precoVenda)}</span></div>`).join('')}</div></section>`).join('');
  closeModal();await imprimir('pr-eti');
};

/* ============================ AJUSTES ============================ */
const RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /{document=**} {
      allow read, write: if request.auth != null
        && request.auth.token.email == "SEU-EMAIL@EXEMPLO.COM";
    }
  }
}`;
PAGES.ajustes=()=>{
  const c=S.cfg;
  return head('Ajustes','Valores usados nos cálculos de custo e preço')+
  `<form class="card" data-form="cfg" style="margin-bottom:16px"><h2>Seus valores</h2>
    <div class="g2"><label class="f">Como devemos te chamar?<input class="in" name="nome" value="${esc(c.nome)}"></label>
    <label class="f">Meta de vendas por mês (R$)<input class="in" type="number" step="any" min="0" name="metaMensal" value="${c.metaMensal}"></label>
    <label class="f">Quanto vale a sua hora (R$)<input class="in" type="number" step="any" min="0" name="valorHora" value="${c.valorHora}"><span class="hint">Entra no custo de cada peça pela mão de obra</span></label>
    <label class="f">Multiplicador para preço sugerido<input class="in" type="number" step="any" min="1" name="multiplicador" value="${c.multiplicador}"><span class="hint">Custo × este número = preço sugerido</span></label>
    <label class="f">Meta de horas por semana<input class="in" type="number" step="any" min="0" name="metaHorasSemana" value="${c.metaHorasSemana}"><span class="hint">Conta modelagem, pintura e finalização</span></label></div>
    <label class="f" style="display:flex;gap:10px;align-items:center"><input type="checkbox" name="incluirSecagem" ${c.incluirSecagem?'checked':''} style="width:20px;height:20px"> Contar o tempo de secagem como mão de obra</label>
    <button class="btn">${ic('check')} Salvar ajustes</button></form>
  ${catCard()}${temaCard()}${instalarCard()}
  <div class="card" style="margin-bottom:16px"><h2>Cópia de segurança</h2><p class="hint" style="margin-top:0">Baixe todos os dados em um arquivo ou restaure a partir de uma cópia anterior.</p>
    <div class="acts"><button class="btn soft c-salvia" data-act="backup">${ic('download')} Baixar backup</button><label class="btn ghost" style="cursor:pointer">Restaurar backup<input type="file" accept="application/json" data-file="import" hidden></label>
    ${USE_FB?'':`<button class="btn danger" data-act="limpar">${ic('trash')} Apagar dados deste navegador</button><button class="btn ghost" data-act="exemplo">Recarregar dados de exemplo</button>`}</div></div>
  <div class="card"><h2>Firebase</h2>
    <p><span class="chip ${USE_FB?'c-salvia':'c-ouro'}">${USE_FB?'Conectado ao seu projeto Firebase':'Modo demonstração, sem Firebase'}</span></p>
    <details ${USE_FB?'':'open'}><summary>Como conectar ao seu Firebase</summary><ol class="steps">
      <li>No <b>console.firebase.google.com</b>, crie um projeto e adicione um app Web.</li>
      <li>Ative o <b>Authentication</b> (método E-mail/senha) e crie o seu usuário.</li>
      <li>Ative o <b>Firestore Database</b> e cole as regras abaixo, trocando pelo seu e-mail.</li>
      <li>Copie o <code>firebaseConfig</code> e cole no arquivo <code>public/firebase-config.js</code>.</li>
      <li>Publique com <code>firebase deploy</code> (Hosting) ou teste com <code>firebase emulators:start</code>. O login do Firebase não funciona abrindo o arquivo direto do computador.</li></ol>
      <pre class="code">${esc(RULES)}</pre><button class="btn ghost sm" data-act="copiarRegras">${ic('copy')} Copiar regras</button></details>
    <details><summary>Como os dados ficam organizados</summary><p class="hint">Coleções no Firestore: <b>pecas</b>, <b>materiais</b>, <b>horas</b>, <b>producoes</b>, <b>vendas</b>, <b>lotes</b>, <b>despesas</b> e o documento <b>config/geral</b>. As fotos das peças são reduzidas e guardadas dentro do próprio documento da peça.</p></details>
  </div>`;
};
FORMS.cfg=async f=>{const fd=new FormData(f);await store.saveCfg({nome:fd.get('nome').trim(),metaMensal:+fd.get('metaMensal')||0,metaHorasSemana:+fd.get('metaHorasSemana')||0,valorHora:+fd.get('valorHora')||0,multiplicador:Math.max(1,+fd.get('multiplicador')||1),incluirSecagem:fd.get('incluirSecagem')==='on'});toast('Ajustes salvos')};
A.backup=()=>download('ateliermf-backup-'+today()+'.json',JSON.stringify(S,null,1),'application/json');
A.copiarRegras=async()=>{try{await navigator.clipboard.writeText(RULES);toast('Regras copiadas')}catch(e){toast('Não foi possível copiar')}};
A.limpar=async()=>{if(await ask('Apagar tudo?','Todos os dados salvos neste navegador serão removidos. Faça um backup antes, se precisar.','Apagar tudo')){COLS.forEach(c=>S[c]=[]);S.cfg={...DEFAULT_CFG};persistLocal();render();toast('Dados apagados')}};
A.exemplo=async()=>{if(await ask('Recarregar exemplos?','Os dados atuais deste navegador serão substituídos pelos dados de exemplo.','Substituir')){seedDemo();persistLocal();render();toast('Dados de exemplo carregados')}};

/* ============================ login / Firebase ============================ */
FORMS.login=async f=>{const fd=new FormData(f);$('#loginErr').textContent='';try{await auth.signInWithEmailAndPassword(fd.get('email'),fd.get('senha'))}catch(e){$('#loginErr').textContent='E-mail ou senha incorretos.'}};
A.resetSenha=async()=>{const em=$('#login [name=email]').value.trim();if(!em){$('#loginErr').textContent='Digite seu e-mail para receber o link de redefinição.';return}try{await auth.sendPasswordResetEmail(em);$('#loginErr').textContent='Enviamos um link de redefinição para o seu e-mail.'}catch(e){$('#loginErr').textContent='Não foi possível enviar o e-mail.'}};
A.sair=()=>auth.signOut();
A.close=()=>closeModal();

/* ============================ eventos globais ============================ */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){if(t.tagName==='A')e.preventDefault();f(t.dataset,t,e)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();FORMS[f.dataset.form](f,e)});
document.addEventListener('input',e=>{
  const u=e.target.dataset&&e.target.dataset.ui;if(u){setUI(u,e.target.value);return}
  const f=e.target.closest('[data-live]');if(f&&LIVE[f.dataset.live])LIVE[f.dataset.live](f,e);
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.tema!==undefined){setTema(t.value);return}
  if(t.dataset&&t.dataset.file==='foto'&&t.files[0]){try{formFoto=await comprimirFoto(t.files[0]);$('#fotoPrev').innerHTML=`<img src="${formFoto}" alt="">`}catch(err){toast('Não foi possível ler a imagem')}}
  if(t.dataset&&t.dataset.file==='import'&&t.files[0]){
    try{
      const d=JSON.parse(await t.files[0].text());
      if(!await ask('Restaurar backup?','Os itens do arquivo serão adicionados ou atualizados. Itens com o mesmo código serão sobrescritos.','Restaurar'))return;
      for(const c of COLS)for(const o of (d[c]||[]))await store.save(c,o);
      if(d.cfg)await store.saveCfg(d.cfg);
      toast('Backup restaurado');
    }catch(err){toast('Arquivo de backup inválido')}
    t.value='';
  }
});
window.addEventListener('hashchange',route);

/* ============================ início ============================ */
aplicaTema();
['logoSide','logoTop','logoLogin'].forEach(i=>{$('#'+i).src=LOGO});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(USE_FB){
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fs=firebase.firestore();try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  auth.onAuthStateChanged(u=>{if(u){$('#login').classList.remove('on');subscribe();ready=true;route()}else{unsub();ready=false;$('#login').classList.add('on')}});
}else{
  if(!loadLocal()){seedDemo();persistLocal()}
  ready=true;route();
}
</script>
</body>
</html>
